{% extends 'base.html' %}

{% block content %}
<section class="py-20 px-4">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">
            تحليل <span class="gradient-text">الأداء</span>
        </h1>
        <p class="text-xl text-gray-400">
            احصل على تحليل مفصل لأداء جهازك
        </p>
    </div>
</section>

<section class="py-12 px-4">
    <div class="max-w-4xl mx-auto">
        <div class="neon-card p-8">
            <div class="mb-6">
                <label class="block text-white mb-2">اختر جهازك</label>
                <select class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none">
                    <option>اختر جهاز...</option>
                    {% for device in devices %}
                    <option>{{ device.brand }} {{ device.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-6">
                <label class="block text-white mb-2">نوع الاستخدام</label>
                <div class="grid grid-cols-3 gap-4">
                    <button class="p-4 border border-gray-700 rounded-xl hover:border-neon-blue hover:bg-neon-blue/10 transition-all text-white">
                        <i class="fas fa-gamepad text-2xl mb-2"></i>
                        <p>ألعاب</p>
                    </button>
                    <button class="p-4 border border-gray-700 rounded-xl hover:border-neon-purple hover:bg-neon-purple/10 transition-all text-white">
                        <i class="fas fa-brain text-2xl mb-2"></i>
                        <p>ذكاء اصطناعي</p>
                    </button>
                    <button class="p-4 border border-gray-700 rounded-xl hover:border-neon-pink hover:bg-neon-pink/10 transition-all text-white">
                        <i class="fas fa-code text-2xl mb-2"></i>
                        <p>تطوير</p>
                    </button>
                </div>
            </div>
            
            <button class="w-full py-4 bg-gradient-to-r from-neon-blue to-neon-purple rounded-xl text-white font-bold hover:shadow-[0_0_30px_rgba(0,243,255,0.4)] transition-all">
                حلل الأداء
            </button>
        </div>
    </div>
</section>
{% endblock %}
