{% extends 'base.html' %}

{% block content %}
<section class="py-20 px-4">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">
            مقارنة <span class="gradient-text">الأجهزة</span>
        </h1>
        <p class="text-xl text-gray-400">
            قارن بين الأجهزة المختلفة لاختيار الأنسب لك
        </p>
    </div>
</section>

<section class="py-12 px-4">
    <div class="max-w-6xl mx-auto">
        <div class="neon-card p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div>
                    <label class="block text-white mb-2">الجهاز الأول</label>
                    <select class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none">
                        <option>اختر جهاز...</option>
                        {% for device in devices %}
                        <option>{{ device.brand }} {{ device.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-white mb-2">الجهاز الثاني</label>
                    <select class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none">
                        <option>اختر جهاز...</option>
                        {% for device in devices %}
                        <option>{{ device.brand }} {{ device.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <button class="w-full py-4 bg-gradient-to-r from-neon-blue to-neon-purple rounded-xl text-white font-bold hover:shadow-[0_0_30px_rgba(0,243,255,0.4)] transition-all">
                قارن
            </button>
        </div>
    </div>
</section>
{% endblock %}
