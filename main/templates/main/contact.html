{% extends 'base.html' %}

{% block content %}
<section class="py-20 px-4">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">
            اتصل بنا
        </h1>
        <p class="text-xl text-gray-400">
            نحن هنا لمساعدتك. تواصل معنا لأي استفسار أو اقتراح
        </p>
    </div>
</section>

<section class="py-12 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="neon-card p-8">
            <form onsubmit="event.preventDefault(); showNotification('تم إرسال رسالتك بنجاح!');">
                <div class="mb-6">
                    <label class="block text-white mb-2">الاسم</label>
                    <input type="text" 
                           class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none transition-colors"
                           placeholder="اسمك الكامل">
                </div>
                <div class="mb-6">
                    <label class="block text-white mb-2">البريد الإلكتروني</label>
                    <input type="email" 
                           class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none transition-colors"
                           placeholder="your@email.com">
                </div>
                <div class="mb-6">
                    <label class="block text-white mb-2">الرسالة</label>
                    <textarea rows="5"
                              class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl text-white focus:border-neon-blue focus:outline-none transition-colors"
                              placeholder="اكتب رسالتك هنا..."></textarea>
                </div>
                <button type="submit" 
                        class="w-full py-4 bg-gradient-to-r from-neon-blue to-neon-purple rounded-xl text-white font-bold hover:shadow-[0_0_30px_rgba(0,243,255,0.4)] transition-all">
                    إرسال الرسالة
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
